<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!--
    动作按钮的底：一只**小鲸鱼**（用户 2026-11-06 要的形状，之前是 Kenney 的圆底）。
    配色沿用 A 套那一档：面 #ebf5fb、环 #6990a7（见 problem/03 §3.10 的 OKLCH 阶梯）。

    边框怎么来的：**同一个形状画两层**——
      ① 填色 + 描边同色、描边宽 12 单位 → 轮廓向外胀出 6 单位；
      ② 再盖一层只有填色的同一形状。
    于是并集外沿得到一圈厚度正好 6 单位（显示 3 CSS px）的边，
    而形状内部不会多出任何横线——这是云朵气泡那条的同款做法
    （分两块画「身子 + 尾巴」会在接缝处留一道封口线，见 problem/03 §3.8）。

    尺寸：80×80 单位画到 40×40 CSS px（比例 0.5）。**命中区仍是那颗 40×40 的方块**，
    鲸鱼墨迹只占 x 4..78、y 14..60，右边与下边那截透明像素照样点得着——
    这是有意的：图标本身才 16~24px，按图标去点太费眼睛（这条老规矩没变）。

    投影不在这里，走 CSS `filter: drop-shadow()`：它跟着 alpha 轮廓走，
    画进素材就变成一张永远甩不掉的灰雾，而且换尺寸会一起缩放。
  -->
  <g fill="#ebf5fb" stroke="#6990a7" stroke-width="12" stroke-linejoin="round">
    <path d="M8 46 C8 28 24 20 42 24 C54 27 60 34 62 40 C64 30 70 22 78 18 C78 30 72 40 64 46 C56 56 22 60 10 52 Z" />
  </g>
  <g fill="#ebf5fb">
    <path d="M8 46 C8 28 24 20 42 24 C54 27 60 34 62 40 C64 30 70 22 78 18 C78 30 72 40 64 46 C56 56 22 60 10 52 Z" />
  </g>
</svg>
