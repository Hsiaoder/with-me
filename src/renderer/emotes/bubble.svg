<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    聊天气泡底图，矢量。形状照用户给的 `E:\ai-pet\svg\chat-speech-bubble-svgrepo-com.svg`
    （SVG Repo 导出）量出来**重画**，路径没搬。
    量法是 `spike/bubble-shape.mjs`：内联进 Chromium，逐点问 `isPointInFill` / `isPointInStroke`，
    同时报「着墨段」与「空腔段」——这种素材是一条 path 两个子路径靠缠绕方向凑环 + 尾巴，
    读 d 字符串很容易把内沿当外沿，而且圆心并不在 viewBox 正中。

    量到的形状（512 单位）：
    · 主泡是**正圆**，圆心 (256, 213.33)，外沿半径 213.33、内腔半径 192 → 环厚 21.33（占框 4.2%）。
      外沿正好切在 viewBox 上沿（213.33 − 213.33 = 0），左右各留 42.67 的空。
    · 尾巴是**正下方一个尖**：外沿两条直线收到 (256, 512)（正好是框底），内沿收到 (256, 482.73)，
      尖上带一个小圆头。所以这颗气泡是「尖对着宠物头顶」的，不像上一版尾巴歪在左下。
    · 内腔 = 那个圆 + 尾巴根的一条通道（空腔纵向一直延伸到 y≈448 才收窄）。

    「边框要细一点」是用户点名要的，这里就是原图自己的比例：环厚 21.33/512，
    220px 显示时约 **9.2 CSS px**（上一版 iconfont 那支是 85.33/1024，显示 18.3px，粗了一倍）。
    要再粗/再细只动 `stroke-width` 一个数——环是**描边**画出来的，不是两层填充叠出来的。

    画法：一条**中线**轮廓（半径取内外沿的中点 202.67），`fill` 给实心白、`stroke` 给那圈蓝。
    这样环厚就是 stroke-width 一个旋钮，且内腔与环是同一条闭合路径的两面，
    不会再出现上一版「白圆 + 白嘴两块叠、反走样边重合显出一道灰弧」那种接缝
    （见 problem/03 §3.8）。
    中线两个尾巴交点 (186.19,403.65) / (325.81,403.65) 是原图内外沿交点的中点再**贴回中线圆**
    （验算：325.81−256=69.81、403.65−213.33=190.32，勾股 202.66 ✓），尾巴尖取内外尖的中点 (256,497.37)。
  -->
  <path
    d="M256 10.667 A202.667 202.667 0 0 1 325.81 403.65 L256 497.37 L186.19 403.65 A202.667 202.667 0 0 1 256 10.667 Z"
    fill="#ffffff"
    stroke="#92c7e3"
    stroke-width="21.333"
    stroke-linejoin="round"
  />
</svg>
