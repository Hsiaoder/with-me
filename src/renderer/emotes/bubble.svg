<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320">
  <!--
    聊天气泡底图，矢量。**圆角矩形 + 底部居中的三角尾巴**，内腔实心白。
    （2026-11-05 从「正圆 + 尖」换过来的：用户说圆腔里塞矩形文字块总是浪费一圈，
      而且边框还要再细——见 problem/03 §3.8。）

    画法：**一条闭合轮廓**，`fill` 给实心白、`stroke` 给那圈蓝。
    轮廓走的是环的**中线**（描边一半压在内侧、一半压在外侧），所以：
      环厚 = stroke-width 一个旋钮 = 12 单位 → 220px 显示时 **6 CSS px**
      （上一版 9.2，再上一版 18.3。再往下别低于 4px，2× 远程桌面上会开始发虚。）
      外沿 = 中线外扩 6 → 上 0、左 0、右 440、下 318（尾巴尖 306 + 半个环）
      内腔 = 中线下缩 6 → x 12..428、y 12..240 → CSS 6..214 × 6..120

    为什么必须是一条路径：分开画「圆角矩形」和「三角尾巴」的话，矩形那条**底边的描边**
    会横穿尾巴根部，看起来像尾巴被一道线封口——环要连续、交界处不能有那根横线。

    数字（440×320 单位，显示 220×160，比例 0.5）：
    · 矩形中线 x 6..434、y 6..246，圆角半径 36（显示 18 CSS px）
    · 尾巴：底边上从 (186,246) 收到尖 (220,306) 再回到 (254,246)——base 68 单位（34 CSS）、
      高 60 单位（30 CSS），`stroke-linejoin: round` 把尖收成圆头，不扎眼睛
    · 尖正好落在框底附近（318/320），而气泡整体浮在宠物头顶 → 尾巴指着它

    文字与回应按钮按**内腔矩形**排（不是圆）：内容块 150×84 居中，四角离内腔边 ≥ 14 CSS px。
    具体数在 style.css，`test/config.test.ts` 从这份素材里读回中线的六个数自己重算，不抄。
  -->
  <path
    d="M42 6 H398 A36 36 0 0 1 434 42 V210 A36 36 0 0 1 398 246 H254 L220 306 L186 246 H42 A36 36 0 0 1 6 210 V42 A36 36 0 0 1 42 6 Z"
    fill="#ffffff"
    stroke="#92c7e3"
    stroke-width="12"
    stroke-linejoin="round"
  />
</svg>
