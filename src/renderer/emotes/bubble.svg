<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    聊天气泡底图，矢量。形状照用户给的 `E:\ai-pet\svg\泡泡_soap-bubble 1.svg`（iconfont 导出）量的，
    但**路径是重画的**：iconfont 的素材官方禁止商用，而这只宠物将来要进直播间，
    所以这里只借形状与比例，不搬它的路径（对照表见 problem/03 §3.13）。

    量到的原图形状（1024 单位）：主泡中心 (469.33, 640)，外半径 373.33 × 330.67；
    主泡右上一道高光弧（圆心 594,540、半径 148.48 的弧）；左上两颗小泡
    （中心 170.67,170.67 半径 117.33；中心 842.67,277.33 半径 96）。
    原图的环厚是 32 单位，这里改成 24——220px 显示时正好 5.2px，和上一版气泡的描边一样粗。

    三个和上一版（带尾巴的空气泡）不同的地方，都是形状本身的后果，不是选择：
    ① **没有尾巴**，所以它不指向宠物，而是浮在宠物上方——小泡在主泡上方，
       读起来正像「从宠物身上飘起来的」，方向对了。
    ② 内腔是**椭圆**，能用的矩形比外接方框小得多。文字框与那颗回应按钮合起来
       半宽 56 / 半高 42（相对主泡中心），四角落在 0.97 ≤ 1 以内——
       这就是 config.ts 的 BUBBLE_INNER_BOTTOM 现在等于 180 的由来（不是随手取的整数）。
    ③ 内腔填**实心白**而不是半透明：透明置顶窗里半透明白会把桌面混进来，
       深色桌面上文字底下就成灰的（同 problem/05 §5.16 那条投影的教训）。
    描边色沿用 #92C7E3（OKLCH H=232，和 :root 那四档表面色同一支蓝）。
  -->
  <g stroke="#92c7e3" stroke-width="24" fill="none">
    <!-- 主泡：里面是实心白，外面那圈是描边 -->
    <ellipse cx="469.33" cy="640" rx="361.33" ry="318.67" fill="#ffffff" />
    <!-- 右上高光：贴着内壁的一段弧 -->
    <path d="M566.9 504.8 A148.48 148.48 0 0 1 669.3 586.7" />
    <!-- 两颗小泡：主泡左上与右上，纯描边、不填白（填了会像三个洞） -->
    <circle cx="170.67" cy="170.67" r="105.33" />
    <circle cx="842.67" cy="277.33" r="84" />
  </g>
</svg>
