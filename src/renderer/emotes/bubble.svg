<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    聊天气泡底图，矢量重绘版（替换 `spike/emote-thin.mjs` + `emote-shorten.mjs` 那两步削出来的
    Kenney Emotes Vector PNG——那张放大 5 倍后圆角是二次重采样的，2× 远程桌面上看着发糊）。
    形状按原图逐行量出来复刻，不是凭印象画：身子外沿 x 0..32 / y 0..26、四角外半径 2、
    尾巴两条边都是 45°、底开口 14 宽、尖端被原图裁成 4 宽的平台（原图最后一行就是这个宽度）。
    描边路径走的是**中心线**（内缩 0.5），所以 1 单位宽的描边正好落在最外一圈，
    和原图「1 个源像素的描边」对齐；BUBBLE_INNER_BOTTOM=120 那条内腔契约也因此不用改。
    尾巴和身子是**同一条闭合路径**：分成两个图形画，接缝处会多出一道横线。
    描边色从原图的 #9EC2E9（OKLCH H≈251，比品牌那支蓝偏紫）挪到同 L 同 C 的 H=232，
    和 :root 那四档表面色同一支蓝，不再引入第二个蓝。
  -->
  <path
    d="M2 0.5 H30 A1.5 1.5 0 0 1 31.5 2 V24 A1.5 1.5 0 0 1 30 25.5 H22.5 L17.5 30.5 H14.5 L9.5 25.5 H2 A1.5 1.5 0 0 1 0.5 24 V2 A1.5 1.5 0 0 1 2 0.5 Z"
    fill="#ffffff"
    stroke="#92c7e3"
    stroke-width="1"
    stroke-linejoin="round"
  />
</svg>
