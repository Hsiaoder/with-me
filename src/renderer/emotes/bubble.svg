<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    聊天气泡底图，矢量。形状照用户给的 `E:\ai-pet\svg\聊天气泡.svg`（iconfont 导出）量的，
    **路径是重画的**：iconfont 的素材官方禁止商用，而这只宠物将来要进直播间，
    所以这里只借形状与比例，不搬它的字节（量的过程与那条反走样接缝见 problem/03 §3.8）。

    量出来的形状（`spike/bubble-shape.mjs` 拿 isPointInFill 逐行扫，不是读 d 字符串猜的）：
    · 主泡是**正圆**，圆心 (512, 512)，外沿半径 469.33、内腔半径 384 → 环厚 85.33（占框 8.3%）。
    · 尾巴在**左下**：外沿从主泡最低点 (512, 981.33) 沿水平线退到 (200.53, 981.33)，
      再用三次曲线绕过圆头帽到 (125.91, 854.53)、收在 (148.44, 808.79)（这几点都在外沿圆上）。
      所以它**底边是平的**——那条水平线就是尾巴的下沿，不是画歪了。
    · 内腔不是完整一个圆：左下那一截被张到 y=896 的「嘴」多挖出一块白，
      于是尾巴读起来是从环里长出来的，而不是贴在边上的一块补丁。
    · 原图靠一条 path 的两个子路径（缠绕方向相反）凑出这个环。这里改成**两层填充**：
      先铺外沿轮廓（实心蓝），再盖内腔（实心白）。结果一样，但每一层的数字都能单独核对，
      也不用赌渲染器怎么解释 winding rule。
    · 每层都必须是**一个**闭合形状。上一版把内腔画成「圆 + 嘴」两个白色形状叠在一起，
      交界处两条反走样的边重合，深色桌面上就显出一道浅灰弧（`spike/bubble-ab.mjs` 看图看到的）。

    三个和上一版（肥皂泡）不同的地方，都是形状本身的后果：
    ① 有尾巴了，它**指着宠物**——尾巴在主泡左下、气泡整体浮在头顶。
    ② 主泡正圆、且把 1024 的框基本用满（外沿 42.67..981.33），所以内腔中心就在框的正中 (110, 110)，
      不再像上一版那样偏下偏左；文字与回应按钮那整块按「圆心 (110,110)、内腔半径 82.5」重解。
    ③ 内腔填**实心白**而不是半透明：透明置顶窗里半透明白会把桌面混进来，
      深色桌面上文字底下就成灰的（同 problem/05 §5.16 那条投影的教训）。
    描边色沿用 #92C7E3（OKLCH H=232，和 :root 那四档表面色同一支蓝）。
  -->
  <g fill="#92c7e3">
    <!-- 第一层：外沿轮廓。主泡的外沿圆 + 左下那截尾巴（同色，重叠看不出来） -->
    <circle cx="512" cy="512" r="469.33" />
    <path d="M512 981.33 H200.53 C135.42 981.33 94.29 911.4 125.91 854.53 L148.44 808.79 Z" />
  </g>
  <!--
    第二层：内腔。一整条闭合路径 = 尾巴根部那张「嘴」（从 140.8° 那点沿内沿出来、
    走平到 y=896、再水平收到主泡最低点）+ 从 (512,896) 绕回起点的整圈内沿弧。
    起点 (214.49,754.77) 与终点都是内沿圆上的点（半径 384 验算：
    512-214.49=297.51、754.77-512=242.77，勾股 384.0 ✓）。
  -->
  <path fill="#ffffff" d="M214.49 754.77 C236.21 781.31 242.61 820.26 224.22 853.33 L200.53 896 H512 A384 384 0 1 0 214.49 754.77 Z" />
</svg>
