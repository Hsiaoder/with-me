# 发布打包配置。取舍的理由写在 docs/superpowers/specs/2026-11-11-release-packaging-design.md 第二节，
# 改这里先改那份文档，别只动配置。
appId: com.hsiaoder.with-me
productName: with-me
copyright: with-me contributors

directories:
  output: release      # 不能是 dist/：tsc 产物在那里

# 白名单：src/test/e2e/spike/docs/codex-review 一律不进包。
# dependencies 为空，所以 asar 里只有我们自己的文件。
# LICENSE / NOTICE.md 不在这里——运行时代码不读它们，塞进 asar 等于藏起来；见 extraFiles。
files:
  - dist/**
  - skins/block/**
  - package.json

asar: true
# 重素材留在 asar 外面（qqpet 的 extraResources 是同一路子，见 spike/package-asar.md 的判定）
asarUnpack:
  - '**/*.webm'
  - '**/*.mp3'
  - '**/*.woff2'

# GPLv3 §4 要「随程序一起给出这份许可的副本」。只塞在 app.asar 里的话，
# 下免压 zip 的人在文件系统上根本看不到许可——所以往 exe 旁边再放一份。
extraFiles:
  - from: LICENSE
    to: LICENSE
  - from: NOTICE.md
    to: NOTICE.md

# 托盘在打包后从 process.resourcesPath 读一个稳定路径；见 src/main/index.ts。
extraResources:
  - from: assets/with-me.ico
    to: with-me.ico

npmRebuild: false

win:
  icon: assets/with-me.ico
  target:
    - nsis
    - zip
  artifactName: with-me-${version}-portable.${ext}
  forceCodeSigning: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: with-me-${version}-setup.${ext}

# v1 不做自动更新：不生成 latest.yml，不留更新源（spec 非目标）
publish: null
